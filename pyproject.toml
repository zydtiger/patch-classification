[project]
name = "patch-classification"
version = "0.1.0"
description = "Histopathology patch classification and embedding workflows."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.8.0",
    "seaborn>=0.11.0",
    "tensorboard>=2.9.0",
    "tifffile>=2021.7.2",
    "timm>=0.9.0",
    "torch>=2.0.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.15.0",
    "tqdm>=4.64.0",
    "typer>=0.7.0",
]
